[project]
name = "recipe-rag"
version = "0.1.0"
description = "A configurable RAG pipeline for a recipe corpus"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0,<2.0",
    "openai>=1.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "rank-bm25>=0.2,<1.0",
    "sentence-transformers>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"
